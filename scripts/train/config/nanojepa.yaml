# NanoJEPA — swm-native (Hydra/OmegaConf) reference config.
#
# The teaching path uses the flat configs in `nanojepa_flat/` with the plain
# `scripts/train/nanojepa.py` trainer. This file is the "graduation" form: the
# same hyper-parameters laid out in the stable-worldmodel idiom (grouped,
# typed). `scripts/train/nanojepa.py` loads it via OmegaConf just like a flat
# config; wiring it into a Hydra + Lightning + stable_pretraining harness (à la
# `scripts/train/prejepa.py`) is left as an exercise.
#
# Run:  python scripts/train/nanojepa.py --config scripts/train/config/nanojepa.yaml

env:
  name: swm/FetchPush-v3
  image_size: 64
  num_episodes: 10000
  max_steps: 50

model:
  patch_size: 8
  embed_dim: 192
  encoder_depth: 6
  encoder_heads: 3
  predictor_depth: 4
  predictor_heads: 3
  obs_dim: 25
  act_dim: 4

masking:
  num_targets: 4
  target_scale: [0.15, 0.2]
  target_aspect_ratio: [0.75, 1.5]
  min_context_patches: 16

training:
  epochs: 100
  batch_size: 128
  lr: 1.0e-3
  lr_min: 1.0e-5
  warmup_epochs: 10
  weight_decay_start: 0.04
  weight_decay_end: 0.1
  ema_momentum_start: 0.996
  ema_momentum_end: 1.0
  grad_clip: 1.0
  variance_weight: 1.0
  covariance_weight: 0.04
  vicreg: true
  log_every: 50
  save_every: 10
  mps_cache_every: 50

data:
  path: nanojepa_fetchpush.lance
  num_workers: 4
  pin_memory: true
